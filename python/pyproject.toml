[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-pipeline"
version = "1.0.0"
description = "Python orchestration, copybook conversion and API around a COBOL banking batch"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
banking-pipeline = "banking_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["banking_pipeline*"]

[tool.setuptools.package-data]
banking_pipeline = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
