[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-pipeline"
version = "2.0.0"
description = "Python orchestration around a COBOL banking batch"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pyjwt>=2.8",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "pytest-cov>=5.0"]

[project.scripts]
banking-pipeline = "banking_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["banking_pipeline*"]

[tool.setuptools.package-data]
banking_pipeline = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
